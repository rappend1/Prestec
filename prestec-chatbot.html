<style>
  :root {
    --navy: #1E2B69;
    --violet: #302487;
    --blue-mid: #2A3A8F;
    --white: #FFFFFF;
    --light-bg: #F0F2FA;
    --bubble-bot: #FFFFFF;
    --bubble-user: #302487;
    --text-dark: #1A1A2E;
    --text-muted: #6B7280;
    --border: #DDE2F0;
    --shadow: 0 4px 24px rgba(30,43,105,0.13);
    --radius: 18px;
    --radius-sm: 10px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--light-bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }

  /* ── WIDGET CONTAINER ── */
  #chat-widget {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 720px;
    display: flex;
    flex-direction: column;
    background: var(--white);
    border-radius: var(--radius) var(--radius) 0 0;
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }

  /* ── HEADER ── */
  #chat-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--violet) 100%);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
  }

  #chat-header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.1);
  }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.25);
    overflow: hidden;
  }

  .avatar svg { width: 26px; height: 26px; }

  .header-info { flex: 1; }

  .header-name {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .header-status {
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ADE80;
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text {
    color: rgba(255,255,255,0.75);
    font-size: 12px;
  }

  .header-logo {
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 5px 9px;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  /* ── MESSAGES AREA ── */
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scroll-behavior: smooth;
  }

  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── BUBBLES ── */
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeInUp 0.28s ease forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.bot { align-self: flex-start; max-width: 88%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; max-width: 75%; }

  .msg-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--navy), var(--violet));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .msg-icon svg { width: 15px; height: 15px; }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
  }

  .bot .bubble {
    background: var(--bubble-bot);
    color: var(--text-dark);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(30,43,105,0.07);
  }

  .user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble a {
    color: var(--violet);
    text-decoration: underline;
    word-break: break-all;
  }

  .bot .bubble a { color: var(--violet); }
  .user .bubble a { color: #ccc; }

  .bubble .highlight {
    background: var(--light-bg);
    border-left: 3px solid var(--violet);
    padding: 6px 10px;
    border-radius: 0 8px 8px 0;
    margin: 6px 0;
    font-size: 13px;
  }

  .bubble .info-row {
    display: flex; align-items: flex-start; gap: 7px;
    margin: 3px 0;
    font-size: 13.5px;
  }
  .bubble .info-row .icon { flex-shrink: 0; margin-top: 1px; }

  /* ── TYPING INDICATOR ── */
  #typing-indicator {
    display: none;
    align-self: flex-start;
    align-items: flex-end;
    gap: 8px;
    padding: 4px 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  #typing-indicator.visible {
    display: flex;
    opacity: 1;
  }

  .typing-bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    border-radius: 16px;
    display: flex; gap: 4px; align-items: center;
    box-shadow: 0 1px 3px rgba(30,43,105,0.07);
  }

  .typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #B0BAD4;
    animation: typing 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); background: #B0BAD4; }
    30% { transform: translateY(-5px); background: var(--violet); }
  }

  /* ── OPTIONS AREA ── */
  #options-area {
    flex-shrink: 0;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    border-top: 1px solid var(--border);
    background: #FAFBFF;
    max-height: 280px;
    overflow-y: auto;
  }

  #options-area::-webkit-scrollbar { width: 3px; }
  #options-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .options-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 4px 0 2px;
  }

  .opt-btn {
    background: var(--white);
    border: 1.5px solid var(--border);
    color: var(--navy);
    font-size: 13.5px;
    font-family: var(--font);
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    display: flex; align-items: center; gap: 8px;
    font-weight: 500;
    line-height: 1.3;
  }

  .opt-btn:hover {
    background: var(--light-bg);
    border-color: var(--violet);
    color: var(--violet);
    transform: translateX(2px);
  }

  .opt-btn .btn-icon { flex-shrink: 0; font-size: 16px; }

  .opt-btn.primary {
    background: linear-gradient(135deg, var(--navy), var(--violet));
    color: #fff;
    border-color: transparent;
  }

  .opt-btn.primary:hover {
    opacity: 0.9;
    transform: translateX(2px);
    color: #fff;
  }

  .opt-btn.whatsapp {
    background: #25D366;
    color: #fff;
    border-color: transparent;
    font-weight: 600;
  }

  .opt-btn.whatsapp:hover {
    background: #1ebe5c;
    color: #fff;
    transform: translateX(2px);
  }

  .opt-btn.back {
    background: transparent;
    border-color: transparent;
    color: var(--text-muted);
    font-size: 12.5px;
    padding: 6px 14px;
    justify-content: center;
  }
  .opt-btn.back:hover {
    color: var(--violet);
    background: transparent;
    border-color: transparent;
    transform: none;
  }

  /* ── MAP EMBED ── */
  .map-frame {
    width: 100%;
    height: 160px;
    border-radius: 12px;
    border: none;
    margin-top: 6px;

  /* ── FOOTER ── */
  #chat-footer {
    background: var(--white);
    padding: 8px 16px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex-shrink: 0;

  .footer-text {

    color: var(--text-muted);

  .footer-brand {
    font-size: 11px;
    font-weight: 700;
    color: var(--violet);

  /* ── RESTART BTN ── */
  #restart-btn {

    top: 16px; right: 16px;
    background: rgba(255,255,255,0.15);

  /* ── RESPONSIVE ── */
  @media (max-width: 440px) {
    body { align-items: stretch; }
    #chat-widget { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
  }

  @media (min-height: 800px) {
    #chat-widget { max-height: 780px; }
  }
</style>

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  // move typing indicator to end of messages
  messagesEl.appendChild(typingEl);
  typingEl.classList.add("visible");
  scrollToBottom();
}

function hideTyping() {
  typingEl.classList.remove("visible");
}

function addBotMessage(html) {
  const row = document.createElement("div");
  row.className = "msg-row bot";

  row.innerHTML = `
    <div class="msg-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .9h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
    </div>
    <div class="bubble">${html}</div>
  `;

  messagesEl.insertBefore(row, typingEl);
  scrollToBottom();
}

function addUserMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `<div class="bubble">${text}</div>`;
  messagesEl.insertBefore(row, typingEl);
  scrollToBottom();
}

function clearOptions() {
  optionsEl.innerHTML = "";
}

function renderOptions(options) {
  clearOptions();

  const label = document.createElement("div");
  label.className = "options-label";
  label.textContent = "Seleccioná una opción";
  optionsEl.appendChild(label);

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";

    if (opt.whatsapp) {
      btn.classList.add("whatsapp");
    } else if (opt.back) {
      btn.classList.add("back");
    } else if (opt.url) {
      btn.classList.add("primary");
    }

    btn.innerHTML = opt.label;

    btn.addEventListener("click", () => {
      handleOptionClick(opt);
    });

    optionsEl.appendChild(btn);
  });
}

async function handleOptionClick(opt) {
  if (isProcessing) return;

  // Handle external URL
  if (opt.url) {
    window.open(opt.url, "_blank");
    return;
  }

  // Handle WhatsApp
  if (opt.whatsapp) {
    const msg = opt.msg || "Hola! Me comunico desde el sitio web de Prestec.";
    const url = `${WA_LINK}?text=${encodeURIComponent(msg)}`;
    window.open(url, "_blank");
    addUserMessage(opt.label);
    clearOptions();
    await delay(600);
    showTyping();
    await delay(900);
    hideTyping();
    addBotMessage("¡Perfecto! 💬 Te redirigimos a WhatsApp. Nuestro equipo te responde a la brevedad. <br><br>¿Hay algo más en lo que pueda ayudarte?");
    await delay(400);
    renderOptions([
      { label: "↩ Volver al menú principal", next: "start", back: true }
    ]);
    return;
  }

  // Navigate tree
  if (opt.next) {
    addUserMessage(opt.label);
    clearOptions();
    navigateTo(opt.next);
  }
}

async function navigateTo(nodeId) {
  if (!TREE[nodeId]) nodeId = "no_entiendo";
  currentNode = nodeId;
  const node = TREE[nodeId];
  isProcessing = true;

  for (let i = 0; i < node.messages.length; i++) {
    const msg = node.messages[i];
    showTyping();
    // typing delay scaled to message length
    const baseDelay = Math.min(400 + msg.replace(/<[^>]*>/g, '').length * 12, 1600);
    await delay(baseDelay);
    hideTyping();
    addBotMessage(msg);
    if (i < node.messages.length - 1) await delay(320);
  }

  await delay(250);
  renderOptions(node.options);
  isProcessing = false;
}

function delay(ms) {
  return new Promise(res => setTimeout(res, ms));
}

function restartChat() {
  messagesEl.innerHTML = "";
  messagesEl.appendChild(typingEl);
  clearOptions();
  isProcessing = false;
  navigateTo("start");
}

// ── INIT ──
window.addEventListener("DOMContentLoaded", () => {
  navigateTo("start");
});
</script>
